<!DOCTYPE html>
<html>
  <head>
    <style>
      .header {
        height:100;
        background-color:#1e5fce;
        position:sticky;
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding-left:30;
        padding-right:30;
      }
      .header-title {
        color:white;
        font-family:helvetica;
        font-size:100%;
        font-weight:bold;
      }
      .header-menu {
        height:50;
        background-color:#1e5fce;
        display:grid;
        grid-template-columns:auto auto auto;
        place-content:center;
      }
      .menu-home-button {
        height:50;
        background-color:#1e5fce;
        color:white;
        font-family:helvetica;
        text-align:center;
        border-top:none;
        border-bottom:none;
        border-left:2 solid white;
        border-right:2 solid white;
        transition-duration:0.4s;
      }
      .menu-home-button:hover {
        backgroud-color:white;
        color:#1e5fce;
        cursor:none;
      }
      .menu-resume-button {
        height:50;
        background-color:#1e5fce;
        color:white;
        font-family:helvetica;
        text-align:center;
        border-top:none;
        border-bottom:none;
        border-left:2 solid white;
        border-right:2 solid white;
        transition-duration:0.3s;
      }
      .menu-resume-button:hover {
        backgroud-color:white;
        color:#1e5fce;
        cursor:none;
      }
      .menu-projects-button {
        height:50;
        background-color:#1e5fce;
        color:white;
        font-family:helvetica;
        text-align:center;
        border-top:none;
        border-bottom:none;
        border-left:2 solid white;
        border-right:2 solid white;
        transition-duration:0.3s;
      }
      .menu-projects-button:hover {
        backgroud-color:white;
        color:#1e5fce;
        cursor:none;
      }
      .home-page {
        height:500;
        background-color:white;
        display:flex;
        justify-content:space-evenly;
        align-items:center;
        padding:50;
      }
      .profile-img-box {
        flex:1;
        background-color:white;
        margin:25;
      }
      .profile-textbox {
        flex:2;
        height:240;
        background-color:white
        margin:25px;
      }
      .profile-textbox-text {
        color:#22103f;
        font-family:helvetica;
        font-size:100%;
        text-align:justify;
      }
      .resume-page {
        height:500;
        background-color:#1e5fce;
        color:white;
      }
      .projects-page {
        height:500;
        background-color:white;
        color:#1e5fce;
      }
    </style>
  </head>
  <body>
     <header class="header">
      <div class="header-title">Julián Jaramillo</div>
       <div class="header-menu">
         <button class="button menu-home-button" onclick="home-page">RESUME</button>
         <button class="button menu-resume-button" onclick="resume-page">RESUME</button>
         <button class="button menu-projects-button" onclick="projects-page">PROJECTS</button>
       </div>
    </header>
    <div class="home-page">
      <div class="profile-img-box">
        <img class="profile-img" src="juliantempphoto.jpg" width="180" height="240" alt="Photo of Julián">
      </div>
      <div class="profile-textbox">
        Salutations! I have been passionately designing elephant tutus since I was a wee lad. 
        I studied at the prestigious Animal Couture Institute in Saskatchewan and am currently based in Timbuktu.
        My sister is the coolest person I've ever met!
      </div>
    </div>
    <div class="resume-page">
      <iframe src="https://storymaps.arcgis.com/stories/b0413edf963d47e19b96d0b29df72869" height="400" width="600" title="Promoting Agency in Environmental Relocation"></iframe>
    </div>
    <div class="projects-page">
      fill this section
    </div>
  </body>
</html>
