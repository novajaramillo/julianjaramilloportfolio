<!DOCTYPE html>
<html>
  <head>
    <style>
      .header {
        height:200px;
        background-color:#1e5fce;
        position:sticky;
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding-left:30px;
        padding-right:30px;
      }
      .header-text {
        color:white;
        font-family:helvetica;
        font-size:350%;
        font-weight:bold;
      }
      .header-menu {
        color:white;
      }
      .home-page {
        display:flex;
        flex-direction:row;
        align-self:center;
        justify-content:space-evenly;
        align-items:flex-start;
        left-margin:100px;
        right-margin:100px;
        top-margin:50px;
        bottom-margin:50px;
        gap:30px;
        background-color:white;
      }
      .profile-img-box {
        flex:1;
        align-self:center;
      }
      .profile-textbox {
        flex:1
      }
      .profile-textbox-text {
        color:#22103f;
        font-family:helvetica;
        font-size:100%;
        justify-self:start;
        align-self:center;
        text-align:justify;
      }
      .projects-page {
        background-color:#1e5fce;
      }
    </style>
  </head>
  <body>
     <header class="header">
      <div class="header-text">Julián Jaramillo</div>
    </header>
    <div class="home-page">
      <div class="profile-img-box">
        <img class="profile-img" src="juliantempphoto.jpg" width="99" height="132" alt="Profile photo of Julián">
      </div>
      <div class="profile-textbox">
        Salutations! I have been passionately designing elephant tutus since I was a wee lad. 
        I studied at the prestigious Animal Couture Institute in Saskatchewan and am currently based in Timbuktu.
        My sister is the coolest person I've ever met!
      </div>
    </div>
    <div class="projects-page">
      fill this section
    </div>
  </body>
</html>
